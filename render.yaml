services:
  - type: web
    name: poshub-central-media
    region: frankfurt
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python pos_hub_server.py
    envVars:
      - fromGroup: m3-eu-backup-security
      - key: POS_HUB_DATA_DIR
        value: /var/data
      - key: POS_HUB_PUBLIC_SCHEME
        value: https
      - key: POS_HUB_API_KEY
        sync: false
      - key: BACKUP_RESTORE_LATEST
        value: "0"
